name: Deploy Website

on:
  push:
    branches: [main]
  # No branch filter: a pull request stacked on another branch needs the same
  # checks as one targeting main. There was no pull_request trigger at all, so
  # a PR ran nothing and read as green by default — the suite only ever ran on
  # a developer's own machine, if at all.
  pull_request:
  workflow_dispatch:

# One deploy at a time. Without it two merges seconds apart ran overlapping
# deploys and whichever S3 sync finished last won, which could be the older
# commit's bundle (auth-service #5 and #6 did exactly this to its container on
# 2026-09-25).
#
# Only runs on main can deploy (the deploy role trusts refs/heads/main alone),
# so only they share the group. Everything else, pull requests and dispatches
# from other branches included, gets a group of its own and never queues or
# displaces a main run. cancel-in-progress stays false so a sync is never cut
# off halfway, leaving the bucket half old, half new. GitHub keeps one run
# pending per group and a newer one replaces it, so a burst of merges skips
# straight to the newest.
#
# GitHub does not promise the queue runs in push order, and a re-run of an old
# run joins it too. The tip-of-main check in the deploy job stops both from
# syncing an older bundle. It cannot bring back a tip whose own run was
# displaced from the pending slot (say by a re-run of an old one) or never
# started: the runs that remain are not the tip and skip, with a warning.
# Recover by dispatching this workflow on main.
concurrency:
  group: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && format('deploy-{0}', github.repository) || format('run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Not gated to pull requests: it runs for every event that can reach the
  # deploy job below, because a push to main previously went straight to the S3
  # sync with the vitest suite never having run anywhere in CI.
  #
  # Node 24 in both jobs, deliberately the same: jsdom 30 (the test environment)
  # refuses to load below Node 22.22, and a suite that passes on one runtime says
  # little about a bundle built on another. Both jobs also install with `npm ci`,
  # so what is deployed is the dependency tree that was tested.
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    # A pull request must not sync to S3 or invalidate the distribution; only a
    # push to main or a manual dispatch deploys.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    # A hung job would hold the deploy concurrency slot and block every later
    # deploy, so it must not get GitHub's six-hour default. A deploy takes a
    # couple of minutes.
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read

    env:
      VITE_AGENT_SERVICE_URL: https://spacetraders.radomskyi.com/api/agent/v1
      VITE_NAVIGATION_SERVICE_URL: https://spacetraders.radomskyi.com/api/navigation/v1
      VITE_FLEET_SERVICE_URL: https://spacetraders.radomskyi.com/api/fleet/v1
      VITE_AUTOMATION_SERVICE_URL: https://spacetraders.radomskyi.com/api/automation/v1
      VITE_ST_GATEWAY_URL: https://spacetraders.radomskyi.com
      # VITE_AI_SERVICE_URL is deliberately absent: ai-service has no CloudFront
      # origin, so there is no URL a browser on this domain could reach. The app
      # drops health targets it cannot probe rather than showing a dot that is
      # red forever. Give it an https origin and it belongs here like the rest.
      # Public by design — names the Clerk instance, authorizes nothing. Stored
      # as a repo variable (not a secret) for exactly that reason. Missing here
      # is what shipped the "VITE_CLERK_PUBLISHABLE_KEY is not set" build to
      # every visitor: the operator-auth PR added the key to .env.example but
      # never to the workflow that actually builds what gets deployed.
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Deploys only if this commit is still the tip of main. The group above
      # serializes runs but does not order them, so without this an older run
      # that got the slot second, or a re-run of an old run, would sync its
      # bundle over a newer one. Dispatches from other branches stop here too:
      # the deploy role would refuse them anyway.
      - name: Check this commit is still the tip of main
        id: tip
        run: |
          # --exit-code and no pipe on ls-remote: a failed lookup must fail the
          # run, not read as "not the tip" and skip with a green check. The
          # pattern matches ref-name suffixes (a branch x/refs/heads/main
          # matches too), so keep the exact ref only.
          refs=$(git ls-remote --exit-code origin refs/heads/main)
          tip=$(printf '%s\n' "$refs" | awk '$2 == "refs/heads/main" { print $1 }')
          [ -n "$tip" ] || { echo "::error::refs/heads/main not found on origin"; exit 1; }
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$tip" = "$GITHUB_SHA" ]; then
            echo "Deploying $GITHUB_SHA, the tip of main."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            # Normally the run for $tip is queued behind this one and deploys
            # it. If that run was displaced or never started, nothing does:
            # dispatch this workflow on main.
            echo "::warning::Not deploying $GITHUB_SHA: main is at $tip, whose own run should deploy it. If it has none, run this workflow on main by hand."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying: $GITHUB_REF is not main."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Configure AWS credentials
        if: steps.tip.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::543292785457:role/command-interface-deploy
          aws-region: eu-central-1

      - name: Deploy to S3
        if: steps.tip.outputs.deploy == 'true'
        run: |
          aws s3 sync ./dist s3://spacetraders-radomskyi-com --delete

      - name: Invalidate CloudFront
        if: steps.tip.outputs.deploy == 'true'
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
